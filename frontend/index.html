    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      .initial-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #8b4e08;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .loader {
        animation: rotate 1s infinite;
        height: 50px;
        width: 50px;
      }
      .loader:before,
      .loader:after {
        border-radius: 50%;
        content: '';
        display: block;
        height: 20px;
        width: 20px;
      }
      .loader:before {
        animation: ball1 1s infinite;
        background-color: #cb2025;
        box-shadow: 30px 0 0 #f8b334;
        margin-bottom: 10px;
      }
      .loader:after {
        animation: ball2 1s infinite;
        background-color: #00a096;
        box-shadow: 30px 0 0 #97bf0d;
      }
      @keyframes rotate {
        0% { transform: rotate(0deg) scale(0.8); }
        50% { transform: rotate(360deg) scale(1.2); }
        100% { transform: rotate(720deg) scale(0.8); }
      }
      @keyframes ball1 {
        0% { box-shadow: 30px 0 0 #f8b334; }
        50% { box-shadow: 0 0 0 #f8b334; margin-bottom: 0; transform: translate(15px,15px); }
        100% { box-shadow: 30px 0 0 #f8b334; margin-bottom: 10px; }
      }
      @keyframes ball2 {
        0% { box-shadow: 30px 0 0 #97bf0d; }
        50% { box-shadow: 0 0 0 #97bf0d; margin-top: -20px; transform: translate(15px,15px); }
        100% { box-shadow: 30px 0 0 #97bf0d; margin-top: 0; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader">
        <div class="loader"></div>
      </div>
    </div>
    <script type="text/javascript">

        widgetId: "366577734f49393335383531",
        tokenAuth: "519342TgUdnaZxC26a1205e7P1",
        identifier: "<enter mobile number/email here> (optional)",
        exposeMethods: false,
        success: (data) => {
          console.log("success response", data);
          window.dispatchEvent(new CustomEvent("msg91:otp-success", { detail: data }));
        },
        failure: (error) => {
          console.log("failure reason", error);
          window.dispatchEvent(new CustomEvent("msg91:otp-failure", { detail: error }));
        },
      };
    </script>
    <script type="text/javascript">
      (function loadOtpScript(urls) {
        let i = 0;
        function attempt() {
          const s = document.createElement("script");
          s.src = urls[i];
          s.async = true;
          s.onload = () => {};
          s.onerror = () => {
            i++;
            if (i < urls.length) {
              attempt();
            }
          };
          document.head.appendChild(s);
        }
        attempt();
      })([
        "https://verify.msg91.com/otp-provider.js",
        "https://verify.phone91.com/otp-provider.js",
      ]);
    </script>
